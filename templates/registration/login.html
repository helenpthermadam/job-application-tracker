{% extends "base.html" %}
{% block title %}Log in{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-5">
    <h1 class="h4 mb-3">Log in</h1>
    <form method="post" class="card card-body">
      {% csrf_token %}
      {{ form.non_field_errors }}
      <div class="mb-3">
        <label class="form-label" for="{{ form.username.id_for_label }}">Username</label>
        <input type="text" name="username" class="form-control" id="{{ form.username.id_for_label }}" required autofocus>
      </div>
      <div class="mb-3">
        <label class="form-label" for="{{ form.password.id_for_label }}">Password</label>
        <input type="password" name="password" class="form-control" id="{{ form.password.id_for_label }}" required>
      </div>
      <button class="btn btn-primary" type="submit">Log in</button>
      <p class="mt-3 mb-0 small">New here? <a href="{% url 'signup' %}">Create an account</a></p>
    </form>
  </div>
</div>
{% endblock %}
